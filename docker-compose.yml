name: elggolearnx_2

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elgolearnx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elgolearnx"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py shell -c \"from django.contrib.sites.models import Site; Site.objects.update_or_create(id=1, defaults={'domain': 'localhost:8007', 'name': 'Local Development'})\" &&
      python manage.py load_roadmaps &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app:delegated
      - ./staticfiles:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "0.0.0.0:8007:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      ALLOWED_HOSTS: "*"
      DB_ENGINE: postgresql
      DB_NAME: elgolearnx
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      SITE_DOMAIN: localhost:8007
      SITE_NAME: Local Development
    restart: unless-stopped
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
    name: elggolearnx_2_app_net

volumes:
  media_volume:
  postgres_data:
