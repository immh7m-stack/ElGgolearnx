{% extends "base.html" %}
{% block title %}الملف الشخصي{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-8">الملف الشخصي</h1>
<form method="post" class="max-w-lg space-y-4">
  {% csrf_token %}
  {% for field in form %}
  <div>
    <label class="block text-sm text-slate-400 mb-1">{{ field.label }}</label>
    {{ field }}
  </div>
  {% endfor %}
  <button type="submit" class="px-6 py-2.5 rounded-lg bg-brand hover:bg-brand-dark transition">حفظ</button>
</form>
<style>
  form input, form select, form textarea {
    width: 100%; padding: 0.5rem 1rem; border-radius: 0.5rem;
    background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
  }
</style>
{% endblock %}
